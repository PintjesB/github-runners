services:
  runner:
    image: ${TITAN_RUNNER_IMAGE:?TITAN_RUNNER_IMAGE must be pinned by digest}
    container_name: titan-runner
    restart: always
    security_opt:
      - no-new-privileges:true
    privileged: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
    environment:
      TITAN_EVIDENCE_BASE_URL: ${TITAN_EVIDENCE_BASE_URL:-}
      TITAN_EVIDENCE_AUDIENCE: ${TITAN_EVIDENCE_AUDIENCE:-}
      REPO_URL: ${TITAN_RUNNER_REPO_URL:?TITAN_RUNNER_REPO_URL is required}
      RUNNER_NAME: ${TITAN_RUNNER_NAME:-titan-ci}
      RUNNER_LABELS: ${TITAN_RUNNER_LABELS:-titan-ci}
      RUNNER_STATE_DIR: ${TITAN_RUNNER_STATE_DIR:-/var/lib/titan-runner/state}
      RUNNER_RUNTIME_DIR: ${TITAN_RUNNER_RUNTIME_DIR:-/var/lib/titan-runner/runtime}
      RUNNER_WORK_DIR: /var/lib/titan-runner/work
      RUNNER_BROWSER_DIR: ${TITAN_RUNNER_BROWSER_DIR:-/var/lib/titan-runner/browser}
      RUNNER_ROOT: ${TITAN_RUNNER_ROOT:-/opt/actions-runner}
      CODEX_HOME: /home/runner/.codex
      # The startup entrypoint consumes this token during registration,
      # unsets it, and then execs the persistent listener.
      RUNNER_TOKEN: ${TITAN_RUNNER_TOKEN:-}
      ACTIONS_RUNNER_HOOK_JOB_STARTED: ${ACTIONS_RUNNER_HOOK_JOB_STARTED:-/var/lib/titan-runner/runtime/.hooks/PreJob.sh}
      ACTIONS_RUNNER_HOOK_JOB_COMPLETED: ${ACTIONS_RUNNER_HOOK_JOB_COMPLETED:-/var/lib/titan-runner/runtime/.hooks/PostJob.sh}
    volumes:
      # The Docker socket grants substantial host access.
      - /var/run/docker.sock:/var/run/docker.sock
      - titan-runner-state:/var/lib/titan-runner/state
      - titan-runner-work:/var/lib/titan-runner/work
      - titan-runner-browser:/var/lib/titan-runner/browser
      # ChatGPT/Codex login state. Deleting this volume only requires re-login.
      - titan-runner-codex:/home/runner/.codex
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pgrep -u runner -f 'Runner.Listener' >/dev/null
          && gosu runner docker info >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 3
      # Registration may contact GitHub before the listener process
      # exists; give that startup phase enough time to complete.
      start_period: 2m
    stop_grace_period: 30s
    networks:
      - titan-runner-net

networks:
  titan-runner-net:
    name: titan-runner-net
    driver: bridge

volumes:
  titan-runner-state:
    name: titan-runner-state
  titan-runner-work:
    name: titan-runner-work
  titan-runner-browser:
    name: titan-runner-browser
  titan-runner-codex:
    name: titan-runner-codex
