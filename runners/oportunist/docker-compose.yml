services:
  runner:
    image: ${OPORTUNIST_RUNNER_IMAGE:?OPORTUNIST_RUNNER_IMAGE is required}
    container_name: oportunist-runner
    restart: always
    security_opt:
      - no-new-privileges:true
    privileged: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TITAN_EVIDENCE_BASE_URL: ${TITAN_EVIDENCE_BASE_URL:-}
      TITAN_EVIDENCE_AUDIENCE: ${TITAN_EVIDENCE_AUDIENCE:-}
      REPO_URL: ${OPORTUNIST_RUNNER_REPO_URL:-https://github.com/PintjesB/oportunist}
      RUNNER_NAME: ${OPORTUNIST_RUNNER_NAME:-oportunist-ci}
      RUNNER_LABELS: ${OPORTUNIST_RUNNER_LABELS:-oportunist-ci,codex}
      RUNNER_TOKEN: ${OPORTUNIST_RUNNER_TOKEN:-}
      RUNNER_STATE_DIR: /var/lib/oportunist-runner/state
      RUNNER_RUNTIME_DIR: /var/lib/oportunist-runner/runtime
      RUNNER_WORK_DIR: /var/lib/oportunist-runner/work
      PIP_CACHE_DIR: /var/lib/oportunist-runner/cache/pip
      npm_config_cache: /var/lib/oportunist-runner/cache/npm
      RUNNER_ROOT: /opt/actions-runner
      CODEX_HOME: /home/runner/.codex
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - oportunist-runner-state:/var/lib/oportunist-runner/state
      - oportunist-runner-work:/var/lib/oportunist-runner/work
      - oportunist-runner-cache:/var/lib/oportunist-runner/cache
      - oportunist-runner-codex:/home/runner/.codex
    healthcheck:
      test:
        - CMD-SHELL
        - pgrep -u runner -f 'Runner.Listener' >/dev/null && gosu runner docker info >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    stop_grace_period: 30s
    networks:
      - oportunist-runner-net

  # Requires general-runner PR #61 merged and its image published before deployment.
  # Requires Titan #294 and Oportunist #166 (native actionlint) merged first.
  runner-light:
    image: ${OPORTUNIST_RUNNER_LIGHT_IMAGE:?Set to a published general-runner image}
    profiles: [ci-light]
    container_name: oportunist-runner-light
    restart: always
    cpus: 1
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    privileged: false
    environment:
      REPO_URL: ${OPORTUNIST_RUNNER_REPO_URL:-https://github.com/PintjesB/oportunist}
      RUNNER_NAME: ${OPORTUNIST_RUNNER_LIGHT_NAME:-oportunist-ci-light}
      RUNNER_LABELS: oportunist-ci-light
      RUNNER_TOKEN: ${OPORTUNIST_RUNNER_LIGHT_TOKEN:-}
      # Reuse original registration/work/cache directories for a no-token migration.
      RUNNER_STATE_DIR: /var/lib/oportunist-runner/state
      RUNNER_RUNTIME_DIR: /var/lib/oportunist-runner/runtime
      RUNNER_WORK_DIR: /var/lib/oportunist-runner/work
      PIP_CACHE_DIR: /var/lib/oportunist-runner/cache/pip
      npm_config_cache: /var/lib/oportunist-runner/cache/npm
    volumes:
      - oportunist-runner-light-state:/var/lib/oportunist-runner/state
      - oportunist-runner-light-work:/var/lib/oportunist-runner/work
      - oportunist-runner-light-cache:/var/lib/oportunist-runner/cache
    healthcheck:
      test:
        - CMD-SHELL
        - pgrep -u runner -f 'Runner.Listener' >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    stop_grace_period: 30s
    networks:
      - oportunist-runner-net

networks:
  oportunist-runner-net:
    name: oportunist-runner-net
    driver: bridge

volumes:
  oportunist-runner-state:
    name: oportunist-runner-state
  oportunist-runner-work:
    name: oportunist-runner-work
  oportunist-runner-codex:
    name: oportunist-runner-codex
  oportunist-runner-cache:
    name: oportunist-runner-cache
  oportunist-runner-light-state:
    name: oportunist-runner-light-state
  oportunist-runner-light-work:
    name: oportunist-runner-light-work
  oportunist-runner-light-cache:
    name: oportunist-runner-light-cache
