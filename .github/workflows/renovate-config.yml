name: renovate-config

on:
  pull_request:
    paths:
      - "renovate.json"
      - ".github/workflows/renovate-config.yml"
  push:
    branches:
      - main
    paths:
      - "renovate.json"
      - ".github/workflows/renovate-config.yml"

concurrency:
  group: renovate-config-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        run: npx --yes --package renovate -- renovate-config-validator --strict

      - name: Enforce Renovate policy invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("renovate.json").read_text(encoding="utf-8"))
          assert config["automerge"] is False
          assert config["platformAutomerge"] is False
          assert config["ignoreTests"] is False
          assert not any(rule.get("ignoreTests") is True for rule in config["packageRules"])

          by_description = {
              rule.get("description"): rule for rule in config["packageRules"]
          }
          assert by_description["Keep GitHub Actions updates manual"]["automerge"] is False
          assert by_description["Keep Docker updates manual"]["automerge"] is False
          codex = by_description["Keep the baked Codex CLI update manual"]
          assert codex["matchPackageNames"] == ["@openai/codex"]
          assert codex["automerge"] is False

          workflow = Path(".github/workflows/renovate-config.yml").read_text(encoding="utf-8")
          assert "npx --yes --package renovate -- renovate-config-validator --strict" in workflow
          assert ("--package " + "renovate@") not in workflow
          PY
