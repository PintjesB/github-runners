name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: workflow-lint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run pinned actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          # Use the upstream release instead of Docker Hub's anonymous pull pool.
          # Each supported architecture has a hard-pinned upstream archive SHA-256.
          case "${RUNNER_ARCH}" in
            X64)
              arch=amd64
              expected_sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              ;;
            ARM64)
              arch=arm64
              expected_sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
              ;;
            *) echo "::error::Unsupported runner architecture: ${RUNNER_ARCH}"; exit 1 ;;
          esac
          filename="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          archive="${RUNNER_TEMP}/${filename}"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${filename}" \
            --output "${archive}"
          printf '%s  %s\n' "${expected_sha}" "${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          # The previous pinned Docker image shipped both analyzers.
          # Require them explicitly so moving to a native binary does not weaken checks.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck python3-pyflakes
          command -v shellcheck
          /usr/bin/python3 -m pyflakes --version
          # Ubuntu exposes Pyflakes as a module, not consistently as `pyflakes`.
          printf '%s\n' '#!/bin/sh' 'exec /usr/bin/python3 -m pyflakes "$@"' > "${RUNNER_TEMP}/pyflakes"
          chmod 0755 "${RUNNER_TEMP}/pyflakes"
          export PATH="${RUNNER_TEMP}:${PATH}"
          command -v pyflakes
          "${RUNNER_TEMP}/actionlint" -color
