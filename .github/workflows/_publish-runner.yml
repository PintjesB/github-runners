name: reusable-runner-publish

on:
  workflow_call:
    inputs:
      profile:
        description: Runner profile directory name under runners/
        required: true
        type: string
      image:
        description: GHCR image name without a tag
        required: true
        type: string

permissions: {}

jobs:
  contract:
    name: ${{ inputs.profile }} contract suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install contract dependencies
        working-directory: runners/${{ inputs.profile }}
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          if [ -f tests/requirements.txt ]; then
            python3 -m pip install --quiet --upgrade pip
            python3 -m pip install --quiet --requirement tests/requirements.txt
          fi
      - name: Run profile contract
        working-directory: runners/${{ inputs.profile }}
        run: ./ci-contract.sh

  build:
    name: Build and probe ${{ inputs.profile }} ${{ matrix.platform }}
    needs: contract
    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: amd64
            expected_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64
            expected_arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build native candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./runners/${{ inputs.profile }}
          file: ./runners/${{ inputs.profile }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ inputs.image }}:candidate-${{ github.sha }}-${{ matrix.tag_suffix }}
          cache-from: type=registry,ref=${{ inputs.image }}:buildcache-${{ matrix.tag_suffix }}
          cache-to: type=registry,ref=${{ inputs.image }}:buildcache-${{ matrix.tag_suffix }},mode=min
      - name: Resolve candidate digest
        id: digest
        env:
          IMAGE: ${{ inputs.image }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:candidate-${GITHUB_SHA}-${TAG_SUFFIX}"
          digest="$(docker buildx imagetools inspect "$ref" | awk '$1 == "Digest:" && !found {print $2; found=1}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::invalid candidate digest: $digest"
            exit 1
          fi
          printf '%s\n' "$digest" > "$RUNNER_TEMP/candidate-digest.txt"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Probe native candidate
        env:
          IMAGE: ${{ inputs.image }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/candidate-digest.txt")"
          docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint /usr/local/bin/probe \
            --security-opt no-new-privileges:true \
            --add-host host.docker.internal:host-gateway \
            --shm-size 2gb \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOME=/tmp \
            -e EXPECTED_ARCH="$EXPECTED_ARCH" \
            "${IMAGE}@${digest}" \
            --skip-network
      - name: Upload candidate digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.profile }}-candidate-${{ matrix.tag_suffix }}
          path: ${{ runner.temp }}/candidate-digest.txt
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and validate ${{ inputs.profile }} manifests
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.profile }}-candidate-amd64
          path: ${{ runner.temp }}/inputs/amd64
      - name: Download arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.profile }}-candidate-arm64
          path: ${{ runner.temp }}/inputs/arm64
      - name: Validate and merge exact candidate digests
        id: merge
        env:
          IMAGE: ${{ inputs.image }}
          AMD64_DIGEST_FILE: ${{ runner.temp }}/inputs/amd64/candidate-digest.txt
          ARM64_DIGEST_FILE: ${{ runner.temp }}/inputs/arm64/candidate-digest.txt
        run: |
          set -euo pipefail

          validate_digest() {
            local file="$1" arch="$2" digest
            if [ ! -s "$file" ]; then
              echo "::error::$arch digest file is missing or empty: $file"
              exit 1
            fi
            digest="$(tr -d '[:space:]' < "$file")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$arch digest is malformed: $digest"
              exit 1
            fi
            printf '%s' "$digest"
          }

          check_plain_manifest() {
            local digest="$1" arch="$2" output="" media_type="" rc=1 attempt
            for attempt in 1 2 3 4 5 6; do
              set +e
              output="$(docker buildx imagetools inspect "${IMAGE}@${digest}" 2>&1)"
              rc=$?
              set -e
              media_type="$(printf '%s\n' "$output" | awk '$1 == "MediaType:" && !found {print $2; found=1}')"
              if [ "$rc" -eq 0 ] && [ -n "$media_type" ]; then
                break
              fi
              echo "::warning::$arch manifest lookup attempt $attempt failed; retrying"
              sleep 10
            done
            if [ "$rc" -ne 0 ] || [ -z "$media_type" ]; then
              printf '%s\n' "$output"
              echo "::error::$arch manifest lookup failed"
              exit 1
            fi
            case "$media_type" in
              application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json)
                ;;
              *)
                echo "::error::$arch candidate must be a plain image manifest, got: $media_type"
                exit 1
                ;;
            esac
          }

          amd64="$(validate_digest "$AMD64_DIGEST_FILE" amd64)"
          arm64="$(validate_digest "$ARM64_DIGEST_FILE" arm64)"
          if [ "$amd64" = "$arm64" ]; then
            echo "::error::candidate digests are identical"
            exit 1
          fi

          check_plain_manifest "$amd64" amd64
          check_plain_manifest "$arm64" arm64

          merged_tag="candidate-${GITHUB_SHA}-merged"
          set +e
          docker buildx imagetools create \
            --tag "${IMAGE}:${merged_tag}" \
            "${IMAGE}@${amd64}" \
            "${IMAGE}@${arm64}" \
            2>"$RUNNER_TEMP/imagetools-create.stderr"
          create_rc=$?
          set -e

          echo "::group::imagetools create diagnostics"
          printf 'exit code: %s\n' "$create_rc"
          if [ -s "$RUNNER_TEMP/imagetools-create.stderr" ]; then
            sed 's/^/  /' "$RUNNER_TEMP/imagetools-create.stderr" || true
          fi
          echo "::endgroup::"

          merged=""
          for attempt in 1 2 3 4 5 6; do
            merged="$(docker buildx imagetools inspect "${IMAGE}:${merged_tag}" 2>/dev/null | awk '$1 == "Digest:" && !found {print $2; found=1}' || true)"
            if [[ "$merged" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            echo "::warning::merged manifest not visible yet (attempt $attempt); retrying"
            sleep 10
          done
          if [[ ! "$merged" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::merged manifest could not be resolved after imagetools create (rc=$create_rc)"
            exit 1
          fi

          IMAGE="$IMAGE" MERGED_DIGEST="$merged" AMD64_DIGEST="$amd64" ARM64_DIGEST="$arm64" \
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          image = os.environ["IMAGE"]
          merged = os.environ["MERGED_DIGEST"]
          expected = {
              ("linux", "amd64"): os.environ["AMD64_DIGEST"],
              ("linux", "arm64"): os.environ["ARM64_DIGEST"],
          }
          raw = subprocess.check_output(
              [
                  "docker", "buildx", "imagetools", "inspect",
                  "--format", "{{json .Manifest}}",
                  f"{image}@{merged}",
              ],
              text=True,
          )
          manifests = json.loads(raw).get("manifests", [])
          actual = {}
          for manifest in manifests:
              platform = manifest.get("platform") or {}
              key = (platform.get("os"), platform.get("architecture"))
              digest = manifest.get("digest")
              if key in actual:
                  sys.stderr.write(f"duplicate platform in merged index: {key}\n")
                  sys.exit(1)
              actual[key] = digest
          if actual != expected:
              sys.stderr.write(
                  f"merged index mismatch: expected={expected!r} actual={actual!r}\n"
              )
              sys.exit(1)
          PY

          printf '%s\n' "$merged" > "$RUNNER_TEMP/merged-digest.txt"
          echo "merged_digest=$merged" >> "$GITHUB_OUTPUT"
      - name: Upload merged digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.profile }}-merged-digest
          path: ${{ runner.temp }}/merged-digest.txt
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify ${{ inputs.profile }} merged ${{ matrix.platform }}
    needs: merge
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            expected_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            expected_arch: arm64
    permissions:
      contents: read
    steps:
      - name: Download merged digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.profile }}-merged-digest
          path: ${{ runner.temp }}
      - name: Probe merged image
        env:
          IMAGE: ${{ inputs.image }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint /usr/local/bin/probe \
            --security-opt no-new-privileges:true \
            --add-host host.docker.internal:host-gateway \
            --shm-size 2gb \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOME=/tmp \
            -e EXPECTED_ARCH="$EXPECTED_ARCH" \
            "${IMAGE}@${digest}" \
            --skip-network

  attest:
    name: Attest ${{ inputs.profile }} merged digest
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download merged digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.profile }}-merged-digest
          path: ${{ runner.temp }}
      - name: Resolve digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attach provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  promote:
    name: Promote ${{ inputs.profile }} latest
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download merged digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.profile }}-merged-digest
          path: ${{ runner.temp }}
      - name: Promote exact digest and verify latest
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          merged="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          [[ "$merged" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${merged}"
          latest="$(docker buildx imagetools inspect "${IMAGE}:latest" | awk '$1 == "Digest:" && !found {print $2; found=1}')"
          if [ "$latest" != "$merged" ]; then
            echo "::error::latest digest $latest differs from merged $merged"
            exit 1
          fi
          echo "published ${IMAGE}@${latest}"
